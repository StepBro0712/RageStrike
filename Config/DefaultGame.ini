; Звуки и иконки грузятся по пути в рантайме, ссылок на них в ассетах нет.
; Без этих строк кукер их не пакует, и в собранной игре нет ни звука,
; ни иконок оружия — в редакторе при этом всё работает.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; То же самое с эффектами: материал дыма и системы огня и взрыва грузятся
; по пути из кода, ссылок на них нет, и кукер их пропускал — в собранной
; игре огонь откатывался на оранжевые сферы, а взрыв на отладочный каркас.
; Указаны ровно две папки пака, а не весь он: пак весит 1.2 ГБ, из них
; 386 МБ туман и 291 МБ демо-уровень, которые игре не нужны. Зависимости
; систем (материалы, текстуры) кук подтянет сам, он идёт по ссылкам.
+DirectoriesToAlwaysCook=(Path="/Game/Effects")
+DirectoriesToAlwaysCook=(Path="/Game/NiagaraExamples/FX_Misc")
+DirectoriesToAlwaysCook=(Path="/Game/NiagaraExamples/FX_Explosions")

